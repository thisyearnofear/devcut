<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Clapperboard body -->
  <rect x="3" y="10" width="26" height="18" rx="2.5" fill="#0f0f0f"/>
  <!-- Clapperboard top bar -->
  <rect x="3" y="6" width="26" height="5" rx="1.5" fill="#1a1a1a"/>
  <!-- Diagonal stripes on top bar -->
  <clipPath id="bar">
    <rect x="3" y="6" width="26" height="5" rx="1.5"/>
  </clipPath>
  <g clip-path="url(#bar)">
    <rect x="3" y="6" width="4" height="5" fill="#f5f5f5"/>
    <rect x="11" y="6" width="4" height="5" fill="#f5f5f5"/>
    <rect x="19" y="6" width="4" height="5" fill="#f5f5f5"/>
    <rect x="27" y="6" width="4" height="5" fill="#f5f5f5"/>
  </g>
  <!-- Hinge pin -->
  <circle cx="7" cy="8.5" r="1.2" fill="#888"/>
  <!-- Film lines -->
  <rect x="7" y="16" width="18" height="1.5" rx="0.75" fill="#333"/>
  <rect x="7" y="20" width="14" height="1.5" rx="0.75" fill="#333"/>
  <rect x="7" y="24" width="10" height="1.5" rx="0.75" fill="#333"/>
</svg>
